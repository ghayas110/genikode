<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CrewLink World — aviation social network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0a1b2e"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Star / node field -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="120" cy="120" r="2"/><circle cx="260" cy="80" r="1.5"/><circle cx="400" cy="160" r="2"/>
    <circle cx="540" cy="100" r="1.5"/><circle cx="180" cy="300" r="1.5"/><circle cx="90" cy="500" r="2"/>
    <circle cx="320" cy="620" r="1.5"/><circle cx="500" cy="740" r="2"/><circle cx="220" cy="780" r="1.5"/>
    <circle cx="1500" cy="220" r="1.5"/><circle cx="1420" cy="640" r="2"/><circle cx="1540" cy="500" r="1.5"/>
  </g>

  <!-- Globe -->
  <g transform="translate(1130 450)" opacity="0.9">
    <circle r="300" fill="none" stroke="#1e3a52" stroke-width="2"/>
    <circle r="300" fill="#0c2236" opacity="0.45"/>
    <ellipse rx="300" ry="110" fill="none" stroke="#26506e" stroke-width="1.5" opacity="0.8"/>
    <ellipse rx="300" ry="210" fill="none" stroke="#26506e" stroke-width="1.5" opacity="0.6"/>
    <ellipse rx="110" ry="300" fill="none" stroke="#26506e" stroke-width="1.5" opacity="0.8"/>
    <ellipse rx="210" ry="300" fill="none" stroke="#26506e" stroke-width="1.5" opacity="0.6"/>
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#26506e" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Flight paths between crew nodes -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="6 10" opacity="0.85">
    <path d="M 360 560 Q 760 200 1180 360"/>
    <path d="M 300 360 Q 720 520 1300 520"/>
    <path d="M 520 700 Q 900 560 1240 640"/>
  </g>

  <!-- Crew connection nodes -->
  <g>
    <g transform="translate(360 560)"><circle r="14" fill="#34d399"/><circle r="26" fill="none" stroke="#34d399" stroke-width="2" opacity="0.5"/></g>
    <g transform="translate(300 360)"><circle r="11" fill="#38bdf8"/></g>
    <g transform="translate(520 700)"><circle r="11" fill="#38bdf8"/></g>
    <g transform="translate(1180 360)"><circle r="14" fill="#38bdf8"/><circle r="26" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/></g>
    <g transform="translate(1300 520)"><circle r="11" fill="#34d399"/></g>
    <g transform="translate(1240 640)"><circle r="11" fill="#34d399"/></g>
  </g>

  <!-- Airplane ascending -->
  <g transform="translate(700 470) rotate(-28) scale(1.5)" fill="#e8f4ff">
    <path d="M -120 6 L 30 6 L 70 -34 L 92 -34 L 70 6 L 120 6 L 138 -10 L 152 -10 L 146 8 L 152 26 L 138 26 L 120 12 L 70 12 L 92 50 L 70 50 L 30 12 L -120 12 Z"/>
  </g>
  <!-- Vapor trail -->
  <path d="M 560 690 Q 660 560 700 470" fill="none" stroke="#e8f4ff" stroke-width="3" opacity="0.25" stroke-linecap="round"/>

  <!-- Title -->
  <g transform="translate(120 660)">
    <rect x="0" y="-40" width="54" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="34" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-3">CrewLink World</text>
    <text x="2" y="92" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500" fill="#9fb3c8" letter-spacing="2">AVIATION SOCIAL NETWORK</text>
  </g>

  <!-- Studio mark -->
  <text x="120" y="120" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#5b7186" letter-spacing="4">GENIKODE</text>
</svg>
